name: Build PushCoins APK

on:
  push:
    branches: [pushcoins-delivery]
    paths: ['payload/**', '.github/workflows/build-pushcoins.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sharon delivery branch
        uses: actions/checkout@v4
        with:
          ref: pushcoins-delivery

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare project directory
        run: |
          mkdir -p /tmp/pushcoins
          cp -r payload/. /tmp/pushcoins/

      - name: Generate placeholder coin images
        run: |
          sudo apt-get install -y imagemagick --quiet
          mkdir -p /tmp/pushcoins/assets/coins

          declare -A COINS=(
            ["coin_half"]="gold:#C5A028:½"
            ["coin_1"]="silver:#B0B0B0:1"
            ["coin_2"]="silver:#B0B0B0:2"
            ["coin_5"]="silver:#B0B0B0:5"
            ["coin_10"]="bimetal:#C5A028:10"
          )

          for name in "${!COINS[@]}"; do
            IFS=':' read -r type color label <<< "${COINS[$name]}"
            convert -size 400x400 xc:none \
              -fill "$color" -draw "circle 200,200 200,5" \
              -fill "#00000033" -draw "circle 200,200 195,10" \
              -fill white -font DejaVu-Sans-Bold -pointsize 140 \
              -gravity center -annotate 0 "$label" \
              /tmp/pushcoins/assets/coins/${name}.png
          done

          # Pushka placeholder
          convert -size 400x500 xc:"#F5F0E8" \
            -fill "#8B4513" -draw "roundrectangle 80,100 320,460 20,20" \
            -fill white -font DejaVu-Sans-Bold -pointsize 60 \
            -gravity center -annotate 0 "צדקה" \
            /tmp/pushcoins/assets/pushka.png

          # App icon
          convert -size 1024x1024 xc:"#F5F0E8" \
            -fill "#C5A028" -draw "circle 512,512 512,100" \
            -fill white -font DejaVu-Sans-Bold -pointsize 300 \
            -gravity center -annotate 0 "🪙" \
            /tmp/pushcoins/assets/icon.png || \
          convert -size 1024x1024 xc:"#C5A028" \
            -fill white -font DejaVu-Sans-Bold -pointsize 300 \
            -gravity center -annotate 0 "P" \
            /tmp/pushcoins/assets/icon.png

          cp /tmp/pushcoins/assets/icon.png /tmp/pushcoins/assets/adaptive-icon.png

          echo "Coin images generated:"
          ls -lh /tmp/pushcoins/assets/coins/

      - name: Generate coin sounds
        run: |
          python3 - << 'EOF'
          import wave, struct, math, os

          def beep(path, freq=800, duration=0.25, volume=0.4):
              rate = 44100
              frames = int(rate * duration)
              with wave.open(path.replace('.mp3', '.wav'), 'w') as f:
                  f.setnchannels(1)
                  f.setsampwidth(2)
                  f.setframerate(rate)
                  for i in range(frames):
                      t = i / rate
                      envelope = min(1.0, t * 20) * max(0.0, 1.0 - t / duration)
                      val = int(32767 * volume * envelope * math.sin(2 * math.pi * freq * t))
                      f.writeframes(struct.pack('<h', val))

          os.makedirs('/tmp/pushcoins/assets', exist_ok=True)
          beep('/tmp/pushcoins/assets/coin.wav',  freq=1200, duration=0.20)
          beep('/tmp/pushcoins/assets/coin2.wav', freq=900,  duration=0.25)
          beep('/tmp/pushcoins/assets/coin3.wav', freq=1050, duration=0.22)
          beep('/tmp/pushcoins/assets/coin4.wav', freq=750,  duration=0.28)
          print("WAV files generated")
          EOF

          sudo apt-get install -y ffmpeg --quiet
          for i in 1 2 3 4; do
            ffmpeg -i /tmp/pushcoins/assets/coin${i:1}.wav \
              /tmp/pushcoins/assets/coin${i:1}.mp3 -y -loglevel quiet 2>/dev/null || \
            ffmpeg -i /tmp/pushcoins/assets/coin.wav \
              /tmp/pushcoins/assets/coin${i}.mp3 -y -loglevel quiet
          done
          # Make sure coin.mp3 exists
          ffmpeg -i /tmp/pushcoins/assets/coin.wav \
            /tmp/pushcoins/assets/coin.mp3 -y -loglevel quiet
          ls -lh /tmp/pushcoins/assets/*.mp3

      - name: Install npm dependencies
        working-directory: /tmp/pushcoins
        run: npm install

      - name: Install Expo CLI
        run: npm install -g @expo/cli --silent

      - name: Expo prebuild
        working-directory: /tmp/pushcoins
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          # Remove EAS projectId so prebuild works without Expo account
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json'));
            delete cfg.expo.extra;
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "
          npx expo prebuild --platform android --clean --no-install 2>&1 | tail -10

      - name: Setup Android SDK (handles licenses + packages)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -keystore /tmp/pushcoins.keystore \
            -alias pushcoins \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass PushCoins2024! \
            -keypass PushCoins2024! \
            -dname "CN=Chabad PushCoins, OU=Chabad, O=Chabad K.Borochov, L=Givatayim, ST=IL, C=IL" \
            -noprompt

      - name: Configure release signing in build.gradle
        working-directory: /tmp/pushcoins/android
        run: |
          cat >> app/build.gradle << 'EOF'

          android.signingConfigs {
              pushcoinsRelease {
                  storeFile file('/tmp/pushcoins.keystore')
                  storePassword 'PushCoins2024!'
                  keyAlias 'pushcoins'
                  keyPassword 'PushCoins2024!'
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.pushcoinsRelease
          EOF

      - name: Build signed APK
        working-directory: /tmp/pushcoins/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --quiet 2>&1 | tail -5

      - name: Locate APK
        id: apk
        run: |
          APK=$(find /tmp/pushcoins/android -name "*.apk" -path "*/release/*" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK found: $APK ($(du -sh "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushCoins-Chabad-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pushcoins-v1.0.${{ github.run_number }}
          name: "🪙 PushCoins Chabad — Build ${{ github.run_number }}"
          body: |
            ## PushCoins - Chabad K.Borochov & Tel Ganim

            **Download the APK below and send to community phones.**

            ### Install instructions
            1. Download `PushCoins-Chabad.apk`
            2. Send via WhatsApp/AirDrop to each phone
            3. On the phone: Settings → Security → Allow unknown sources
            4. Open the APK → Install

            ### What's included
            - Drag-and-drop Israeli NIS coins (½ / 1 / 2 / 5 / 10)
            - Coin-drop sounds
            - Running total tracker
            - Donate via **Bit** or **PayBox** to 0508100010
            - Full Hebrew RTL UI
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
