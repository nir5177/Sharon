<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ממשק ניהול — שורשים</title>
<style>
/* ─── BASE ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{
  --navy:#1B2A4A;--navy2:#2D4A7A;--gold:#D4A853;
  --green:#27704a;--red:#c0392b;
  --bg:#EEF0F6;--card:#fff;--border:#D4D9E8;
  --txt:#1B2A4A;--sub:#6B7A9A;--radius:10px;
}
body{font-family:'Heebo','Assistant',Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}

/* ─── LOGIN ─── */
#login-wrap{position:fixed;inset:0;background:linear-gradient(145deg,#0f1b33 0%,#1B2A4A 50%,#2D4A7A 100%);
  display:flex;align-items:center;justify-content:center;z-index:999}
.lcard{background:#fff;border-radius:20px;padding:2.5rem 2rem;width:340px;
  box-shadow:0 32px 80px rgba(0,0,0,.5)}
.lcard-logo{text-align:center;margin-bottom:1.25rem}
.lcard-title{text-align:center;font-size:1.25rem;font-weight:700;color:var(--navy);margin-bottom:.3rem}
.lcard-sub{text-align:center;font-size:.82rem;color:var(--sub);margin-bottom:1.5rem}
.lf{margin-bottom:.9rem}
.lf label{display:block;font-size:.78rem;font-weight:600;color:var(--sub);margin-bottom:.3rem}
.lf input{width:100%;padding:.65rem .9rem;border:1.5px solid var(--border);border-radius:8px;
  font-size:.9rem;font-family:inherit;outline:none;transition:border .15s}
.lf input:focus{border-color:var(--navy2)}
.login-btn{width:100%;padding:.78rem;background:var(--navy);color:#fff;border:none;border-radius:8px;
  font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.login-btn:hover{background:var(--navy2)}
.lerr{background:#fdecea;color:var(--red);border-radius:6px;padding:.5rem .75rem;
  font-size:.8rem;margin-bottom:.75rem;display:none}

/* ─── APP SHELL ─── */
#app{display:none;flex-direction:column;height:100vh}

/* ─── HEADER ─── */
.hdr{height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;
  padding:0 1rem;gap:.6rem;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.hdr-brand{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.hdr-space{flex:1}
.hdr-status{font-size:.72rem;display:flex;align-items:center;gap:.3rem;
  color:rgba(255,255,255,.55);min-width:80px;justify-content:center}
.hdr-status.saving{color:#ffd;animation:pulse .7s infinite alternate}
.hdr-status.saved{color:rgba(140,255,160,.85)}
@keyframes pulse{to{opacity:.4}}
.hbtn{border:none;border-radius:6px;padding:.32rem .75rem;font-size:.78rem;font-weight:700;
  cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.hbtn:hover{opacity:.82}
.hbtn-pub{background:var(--gold);color:var(--navy)}
.hbtn-pub:disabled{opacity:.5;cursor:not-allowed}
.hbtn-out{background:rgba(255,255,255,.13);color:rgba(255,255,255,.85)}

/* ─── SPLIT ─── */
.split{display:flex;flex:1;overflow:hidden}

/* ─── PREVIEW PANEL ─── */
.panel-preview{flex:1;display:flex;flex-direction:column;background:#c5cad8;min-width:0;
  border-left:1px solid #b0b8cc}
.prev-bar{background:#283347;color:rgba(255,255,255,.55);font-size:.68rem;padding:.28rem .7rem;
  display:flex;align-items:center;gap:.5rem;flex-shrink:0;user-select:none}
.prev-bar-lbl{flex:1}
.prev-reload{background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;
  font-size:.72rem;font-family:inherit;padding:.1rem .25rem;border-radius:3px}
.prev-reload:hover{color:#fff;background:rgba(255,255,255,.1)}
#iframe{flex:1;border:none;width:100%;height:100%;background:#fff}

/* ─── EDIT PANEL ─── */
.panel-edit{width:420px;min-width:300px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden}

/* ─── SECTION TABS ─── */
.sec-tabs{display:flex;overflow-x:auto;flex-shrink:0;background:var(--card);
  border-bottom:2px solid var(--border);scrollbar-width:none}
.sec-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:.58rem .78rem;border:none;background:none;cursor:pointer;
  font-size:.75rem;font-weight:600;color:var(--sub);font-family:inherit;
  border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
.stab:hover{color:var(--navy)}
.stab.on{color:var(--navy);border-bottom-color:var(--navy)}

/* ─── FORMS ─── */
.forms{flex:1;overflow-y:auto;padding:.9rem}
.sf{display:none}.sf.on{display:block}
.sf-title{font-size:.72rem;font-weight:700;color:var(--sub);letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}

/* Fields */
.f{margin-bottom:.9rem}
.f>label{display:block;font-size:.77rem;font-weight:600;color:var(--sub);margin-bottom:.28rem}
.f input[type=text],.f input[type=url],.f input[type=tel],.f input[type=email],.f input[type=number],.f textarea,.f select{
  width:100%;padding:.58rem .75rem;border:1.5px solid var(--border);border-radius:8px;
  font-size:.85rem;font-family:inherit;outline:none;background:#fff;color:var(--txt);
  transition:border .15s}
.f input:focus,.f textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(45,74,122,.09)}
.f textarea{resize:vertical;min-height:76px;line-height:1.6}
.f .hint{font-size:.7rem;color:var(--sub);margin-top:.22rem}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}

/* ─── IMAGE WIDGET ─── */
.imgw{border:2px dashed var(--border);border-radius:10px;background:#fff;
  overflow:hidden;transition:border-color .15s}
.imgw:hover{border-color:var(--navy2)}
.imgw-prev{display:none;position:relative;background:#111}
.imgw-prev.on{display:block}
.imgw-prev img{width:100%;max-height:150px;object-fit:cover;display:block}
.imgw-clear{position:absolute;top:.3rem;left:.3rem;background:rgba(0,0,0,.65);color:#fff;
  border:none;border-radius:4px;padding:.18rem .4rem;font-size:.68rem;cursor:pointer;font-family:inherit}
.imgw-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.3rem;padding:1rem .75rem;cursor:pointer;text-align:center;transition:background .15s}
.imgw-drop:hover,.imgw-drop.drag{background:#edf2ff}
.imgw-icon{font-size:1.6rem;line-height:1}
.imgw-txt{font-size:.77rem;font-weight:600;color:var(--sub)}
.imgw-sub{font-size:.67rem;color:#aab}
.imgw-url{display:flex;align-items:center;gap:.35rem;padding:.35rem .55rem;
  border-top:1.5px solid var(--border);background:#f7f8fb}
.imgw-url span{font-size:.65rem;color:#aab;flex-shrink:0;font-weight:600}
.imgw-url input{flex:1;border:none;outline:none;font-size:.74rem;direction:ltr;
  font-family:monospace;background:transparent;color:#555;min-width:0}
.imgw-spinner{position:absolute;inset:0;background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--navy2)}

/* ─── DYNAMIC LIST ─── */
.di{border:1.5px solid var(--border);border-radius:9px;padding:.85rem;
  margin-bottom:.65rem;background:#fff;position:relative}
.di-num{font-size:.68rem;font-weight:700;color:var(--gold);margin-bottom:.55rem;text-transform:uppercase}
.di-rm{position:absolute;top:.55rem;left:.55rem;background:#fdecea;color:var(--red);
  border:none;border-radius:5px;padding:.18rem .45rem;font-size:.7rem;cursor:pointer;font-family:inherit}
.di-rm:hover{background:var(--red);color:#fff}
.btn-add{display:inline-flex;align-items:center;gap:.35rem;background:var(--navy);color:#fff;
  border:none;border-radius:7px;padding:.48rem .95rem;font-size:.8rem;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:.25rem;transition:background .15s}
.btn-add:hover{background:var(--navy2)}

/* Stats */
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.9rem}
.stat-box{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:.55rem .7rem}
.stat-box label{display:block;font-size:.7rem;font-weight:600;color:var(--sub);margin-bottom:.25rem}
.stat-box input{width:100%;border:none;outline:none;font-size:1.15rem;font-weight:700;
  text-align:center;color:var(--navy);font-family:inherit;background:transparent}

/* ─── SAVE BAR ─── */
.save-bar{flex-shrink:0;background:var(--card);border-top:1.5px solid var(--border);
  padding:.65rem .9rem;display:flex;gap:.5rem;align-items:center}
.save-btn{flex:1;background:var(--gold);color:var(--navy);border:none;border-radius:8px;
  padding:.62rem 1rem;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:.35rem;transition:opacity .15s}
.save-btn:hover{opacity:.85}
.save-btn:disabled{opacity:.4;cursor:not-allowed}
.dl-btn{background:#fff;color:var(--navy);border:1.5px solid var(--border);border-radius:8px;
  padding:.62rem .85rem;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:.3rem;transition:background .15s;white-space:nowrap}
.dl-btn:hover{background:var(--bg)}

/* ─── TOAST ─── */
#toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:.65rem 1.5rem;border-radius:8px;
  font-size:.84rem;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.28);
  pointer-events:none;opacity:0;transition:opacity .22s;z-index:9999;
  text-align:center;max-width:90vw;white-space:pre-line}
#toast.on{opacity:1}
#toast.ok{background:var(--green)}
#toast.err{background:var(--red)}

/* ─── SPINNER ─── */
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:rot .65s linear infinite;display:inline-block;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}

/* ─── MOBILE ─── */
.mob-tabs{display:none}
@media(max-width:800px){
  .panel-preview{display:none}
  .panel-edit{width:100%}
  .mob-tabs{display:flex;flex-shrink:0;border-bottom:2px solid var(--border);background:var(--card)}
  .mob-tab{flex:1;padding:.55rem;font-size:.82rem;font-weight:600;border:none;
    background:none;cursor:pointer;font-family:inherit;color:var(--sub)}
  .mob-tab.on{color:var(--navy);border-bottom:2.5px solid var(--navy);margin-bottom:-2px}
  .panel-preview.mob-show{display:flex;position:fixed;inset:48px 0 0 0;z-index:50}
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-wrap">
  <div class="lcard">
    <div class="lcard-logo">
      <svg width="52" height="52" viewBox="0 0 60 60" fill="none">
        <circle cx="30" cy="30" r="30" fill="#1B2A4A"/>
        <path d="M30 48V28M30 28C30 20 22 14 14 18M30 28C30 20 38 14 46 18M30 28C30 22 26 18 22 20M30 28C30 22 34 18 38 20" stroke="#D4A853" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="lcard-title">ממשק ניהול — שורשים</h1>
    <p class="lcard-sub" id="l-sub">הזינו סיסמה להמשך</p>
    <div class="lerr" id="l-err"></div>
    <div class="lf"><label>סיסמה</label>
      <input type="password" id="l-pass" placeholder="••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">כניסה ←</button>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">

  <!-- Header -->
  <header class="hdr">
    <div class="hdr-brand">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7v10l10 5 10-5V7L12 2Z" stroke="#D4A853" stroke-width="1.8"/>
        <path d="M2 7l10 5 10-5M12 22V12" stroke="#D4A853" stroke-width="1.8"/>
      </svg>
      שורשים — ניהול
    </div>
    <div class="hdr-space"></div>
    <div class="hdr-status" id="hdr-status">
      <svg width="7" height="7" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3.5" fill="currentColor"/></svg>
      <span id="hdr-status-txt">מוכן</span>
    </div>
    <button class="hbtn hbtn-pub" id="pub-btn" onclick="publish()">פרסם לאתר ↑</button>
    <button class="hbtn hbtn-out" onclick="doLogout()">יציאה</button>
  </header>

  <!-- Mobile tabs -->
  <div class="mob-tabs">
    <button class="mob-tab on" id="mob-edit-tab" onclick="mobSwitch('edit')">✏ עריכה</button>
    <button class="mob-tab" id="mob-prev-tab" onclick="mobSwitch('preview')">👁 תצוגה</button>
  </div>

  <!-- Split -->
  <div class="split">

    <!-- PREVIEW -->
    <div class="panel-preview" id="panel-preview">
      <div class="prev-bar">
        <span class="prev-bar-lbl">תצוגה מקדימה — האתר החי</span>
        <button class="prev-reload" onclick="reloadIframe()">⟳ רענן</button>
      </div>
      <iframe id="iframe" src="../" loading="lazy"></iframe>
    </div>

    <!-- EDIT PANEL -->
    <div class="panel-edit">

      <!-- Section tabs -->
      <div class="sec-tabs" id="sec-tabs">
        <button class="stab on" data-s="hero"         onclick="showSec('hero')">🏠 ראשי</button>
        <button class="stab"     data-s="about"        onclick="showSec('about')">📖 אודות</button>
        <button class="stab"     data-s="services"     onclick="showSec('services')">🛠 שירותים</button>
        <button class="stab"     data-s="team"         onclick="showSec('team')">👥 צוות</button>
        <button class="stab"     data-s="events"       onclick="showSec('events')">📅 אירועים</button>
        <button class="stab"     data-s="testimonials" onclick="showSec('testimonials')">💬 עדויות</button>
        <button class="stab"     data-s="stats"        onclick="showSec('stats')">📊 נתונים</button>
        <button class="stab"     data-s="contact"      onclick="showSec('contact')">📞 קשר</button>
      </div>

      <!-- Forms -->
      <div class="forms" id="forms"></div>

      <!-- Save bar -->
      <div class="save-bar">
        <button class="save-btn" id="save-btn" onclick="saveDraft()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          שמור טיוטה
        </button>
        <button class="dl-btn" id="dl-btn" style="display:none" onclick="downloadFiles()">↓ הורד קבצים</button>
      </div>

    </div><!-- /panel-edit -->
  </div><!-- /split -->
</div><!-- /app -->

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════ */
var REPO_OWNER  = 'nir5177';
var REPO_NAME   = 'Sharon';
var REPO_BRANCH = 'gh-pages';
var ADMIN_PAT   = '%%ADMIN_PAT%%';
var hasPAT      = ADMIN_PAT && ADMIN_PAT !== '%%ADMIN_PAT%%';

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function g(id){return document.getElementById(id)}
function gv(id){var e=g(id);return e?e.value.trim():''}
function sv(id,v){var e=g(id);if(e)e.value=(v==null?'':v)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
var _tt;
function toast(msg, cls, ms){
  var t=g('toast');
  t.textContent=msg; t.className='on'+(cls?' '+cls:'');
  clearTimeout(_tt);
  _tt=setTimeout(function(){t.className=''}, ms||3500);
}

/* ═══════════════════════════════════════
   HEADER STATUS
═══════════════════════════════════════ */
function setStatus(cls,txt){
  var b=g('hdr-status'); b.className='hdr-status '+cls;
  g('hdr-status-txt').textContent=txt;
}

/* ═══════════════════════════════════════
   AUTH
═══════════════════════════════════════ */
async function sha256(s){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function doLogin(){
  var pass=g('l-pass').value;
  if(!pass){showLErr('הזינו סיסמה');return}
  var stored=localStorage.getItem('shoreshim_phash');
  sha256(pass).then(function(h){
    if(!stored){
      if(pass.length<6){showLErr('סיסמה — לפחות 6 תווים');return}
      localStorage.setItem('shoreshim_phash',h);
      sessionStorage.setItem('shoreshim_auth','1');
      launchApp();
    } else if(h===stored){
      sessionStorage.setItem('shoreshim_auth','1');
      launchApp();
    } else {
      showLErr('סיסמה שגויה');
    }
  });
}

function showLErr(m){
  var e=g('l-err'); e.textContent=m; e.style.display='block';
  setTimeout(function(){e.style.display='none'},3000);
}

function doLogout(){
  sessionStorage.removeItem('shoreshim_auth');
  location.reload();
}

/* ═══════════════════════════════════════
   SECTION TABS
═══════════════════════════════════════ */
var _curSec = 'hero';
var _secPreviewId = {
  hero:'hero', about:'about', services:'services', team:'team',
  events:'events-section', testimonials:'testimonials', stats:'stats', contact:'contact'
};

function showSec(s){
  _curSec = s;
  document.querySelectorAll('.stab').forEach(function(b){
    b.classList.toggle('on', b.dataset.s===s);
  });
  document.querySelectorAll('.sf').forEach(function(f){
    f.classList.toggle('on', f.id==='sf-'+s);
  });
  pmsg({type:'scroll-to', id:_secPreviewId[s]||s});
  // Mobile: switch to preview briefly then back
}

/* ═══════════════════════════════════════
   PREVIEW postMessage
═══════════════════════════════════════ */
function pmsg(data){
  var f=g('iframe');
  if(!f||!f.contentWindow) return;
  try{f.contentWindow.postMessage(data,'*')}catch(e){}
}

function liveText(previewId, val){
  pmsg({type:'update-text', id:previewId, value:val});
  scheduleAS();
}

function reloadIframe(){
  var f=g('iframe');
  if(f) f.src=f.src.split('?')[0]+'?_='+Date.now();
}

/* ═══════════════════════════════════════
   MOBILE TABS
═══════════════════════════════════════ */
function mobSwitch(mode){
  var pp=g('panel-preview');
  var et=g('mob-edit-tab'), pt=g('mob-prev-tab');
  if(mode==='preview'){
    pp.classList.add('mob-show'); et.classList.remove('on'); pt.classList.add('on');
  } else {
    pp.classList.remove('mob-show'); pt.classList.remove('on'); et.classList.add('on');
  }
}

/* ═══════════════════════════════════════
   IMAGE WIDGET
═══════════════════════════════════════ */
function imgw(key){
  /* returns HTML string for an image upload widget */
  var uid='img-url-'+key, pid='img-prev-'+key, fid='img-file-'+key, eid='img-el-'+key;
  return '<div class="imgw" id="imgw-'+key+'">'
    +'<div class="imgw-prev" id="'+pid+'">'
      +'<img id="'+eid+'" src="" alt="">'
      +'<button class="imgw-clear" onclick="clearImgW(\''+key+'\')">✕ הסר</button>'
    +'</div>'
    +'<div class="imgw-drop" id="imgw-drop-'+key+'"'
      +' onclick="g(\''+fid+'\').click()"'
      +' ondragover="event.preventDefault();this.classList.add(\'drag\')"'
      +' ondragleave="this.classList.remove(\'drag\')"'
      +' ondrop="event.preventDefault();this.classList.remove(\'drag\');dropFile(\''+key+'\',event)">'
      +'<div class="imgw-icon">🖼</div>'
      +'<div class="imgw-txt">לחצו לבחירת קובץ</div>'
      +'<div class="imgw-sub">או גררו תמונה לכאן</div>'
    +'</div>'
    +'<div class="imgw-url">'
      +'<span>URL:</span>'
      +'<input type="url" id="'+uid+'" dir="ltr" placeholder="https://..."'
        +' oninput="onUrlInput(\''+key+'\',this.value)">'
    +'</div>'
    +'<input type="file" id="'+fid+'" accept="image/*" style="display:none"'
      +' onchange="onFileInput(\''+key+'\',this)">'
  +'</div>';
}

function setImgW(key, url){
  var p=g('img-prev-'+key), el=g('img-el-'+key), uw=g('img-url-'+key);
  if(!p||!el) return;
  if(url){el.src=url; p.classList.add('on')} else {el.src=''; p.classList.remove('on')}
  if(uw && url!==undefined) uw.value=url||'';
}

function clearImgW(key){
  setImgW(key,'');
  scheduleAS();
  sendImgToPreview(key,'');
}

function onUrlInput(key, url){
  setImgW(key, url);
  sendImgToPreview(key, url);
  scheduleAS();
}

function dropFile(key, event){
  var file = event.dataTransfer.files[0];
  if(file) processFile(key, file);
}

function onFileInput(key, input){
  var file = input.files[0];
  if(file) processFile(key, file);
  input.value=''; /* allow re-select same file */
}

function processFile(key, file){
  /* Show local preview immediately */
  var reader = new FileReader();
  reader.onload = function(e){
    var dataUrl = e.target.result;
    setImgW(key, dataUrl);
    sendImgToPreview(key, dataUrl);
  };
  reader.readAsDataURL(file);

  /* Upload to GitHub if PAT available */
  if(hasPAT){
    setStatus('saving','מעלה תמונה...');
    uploadImgToGH(file).then(function(url){
      setImgW(key, url);
      sendImgToPreview(key, url);
      scheduleAS();
      setStatus('saved','הועלה ✓');
      toast('תמונה הועלתה ✓','ok');
    }).catch(function(err){
      toast('שגיאת העלאה: '+err.message+'\nהתמונה נשמרה בטיוטה מקומית','err',6000);
      var dataUrl = g('img-el-'+key) && g('img-el-'+key).src;
      if(dataUrl) sv('img-url-'+key, dataUrl);
      scheduleAS();
      setStatus('','מוכן');
    });
  } else {
    /* No PAT: store data URL in draft only */
    var dataUrl = g('img-el-'+key) && g('img-el-'+key).src;
    if(dataUrl) sv('img-url-'+key, dataUrl);
    scheduleAS();
    toast('התמונה מוצגת בתצוגה מקדימה.\nלהעלאה קבועה לאתר — הגדירו ADMIN_PAT ב-GitHub Secrets.','',6000);
  }
}

/* ═══════════════════════════════════════
   GITHUB IMAGE UPLOAD
═══════════════════════════════════════ */
async function uploadImgToGH(file){
  var ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  var path = 'images/'+Date.now()+'.'+ext;
  var b64 = await new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(e){res(e.target.result.split(',')[1])};
    r.onerror=rej;
    r.readAsDataURL(file);
  });
  var resp = await fetch('https://api.github.com/repos/'+REPO_OWNER+'/'+REPO_NAME+'/contents/'+path,{
    method:'PUT',
    headers:{'Authorization':'token '+ADMIN_PAT,'Content-Type':'application/json'},
    body:JSON.stringify({message:'Upload image',content:b64,branch:REPO_BRANCH})
  });
  if(!resp.ok){var e=await resp.json();throw new Error(e.message||resp.status)}
  var d=await resp.json();
  return d.content.download_url;
}

async function publish(){

    toast('אין ADMIN_PAT מוגדר.\nהורידו את הקבצים ועלו ידנית, או הגדירו ADMIN_PAT ב-GitHub Secrets.','',7000);

/* ═══════════════════════════════════════
   GITHUB API
═══════════════════════════════════════ */
async function ghPut(path, content){
  var sha=null;
  try{
    var r=await fetch('https://api.github.com/repos/'+REPO_OWNER+'/'+REPO_NAME+'/contents/'+path+'?ref='+REPO_BRANCH,
      {headers:{'Authorization':'token '+ADMIN_PAT}});
    if(r.ok){var d=await r.json(); sha=d.sha}
  }catch(e){}
  var body={message:'Update '+path,content:btoa(unescape(encodeURIComponent(content))),branch:REPO_BRANCH};
  if(sha)body.sha=sha;
  var res=await fetch('https://api.github.com/repos/'+REPO_OWNER+'/'+REPO_NAME+'/contents/'+path,{
    method:'PUT',
    headers:{'Authorization':'token '+ADMIN_PAT,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!res.ok){var e=await res.json(); throw new Error(e.message||res.status)}
}

async function patchDonate(url){
  try{
    var r=await fetch('https://api.github.com/repos/'+REPO_OWNER+'/'+REPO_NAME+'/contents/donate.html?ref='+REPO_BRANCH,
      {headers:{'Authorization':'token '+ADMIN_PAT}});
    if(!r.ok)return null;
    var d=await r.json();
    var html=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
    return html.replace(/var MATARA_URL\s*=\s*'[^']*'/,"var MATARA_URL = '"+url.replace(/'/g,'%27')+"'");
  }catch(e){return null}
}

      '<div class="f"><label>שם</label><input type="text" id="tst-a-'+i+'" value="'+esc(d.author||'')+'" placeholder="שם" oninput="scheduleAS()"></div>'+
      '<div class="f"><label>תפקיד / הגדרה</label><input type="text" id="tst-r-'+i+'" value="'+esc(d.role||'')+'" placeholder="הורה מתמודד" oninput="scheduleAS()"></div>'+
    '</div>'+
    '<div class="f"><label>תמונה</label>'+imgw('tst-'+i)+'</div>';
  g('tst-list').appendChild(el);
  if(d.photoUrl){ sv('img-url-tst-'+i,d.photoUrl); setImgW('tst-'+i,d.photoUrl); }
}

/* ═══════════════════════════════════════
   LAUNCH APP
═══════════════════════════════════════ */
function launchApp(){
  g('login-wrap').style.display='none';
  g('app').style.display='flex';
  g('forms').innerHTML = buildForms();
  loadData();
}

/* ═══════════════════════════════════════
   BOOT
═══════════════════════════════════════ */
(function(){
  var stored=localStorage.getItem('shoreshim_phash');
  if(!stored){
    g('l-sub').textContent='הגדרה ראשונה — בחרו סיסמה (לפחות 6 תווים)';
  }
  if(sessionStorage.getItem('shoreshim_auth')==='1'){
    launchApp();
    return;
  }
  g('l-pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
})();
</script>
