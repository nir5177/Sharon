name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'preview.html', 'sound-demo.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-and-build:
    name: Optimize → Build → Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                    # ← caches node_modules between builds

      - name: Install dependencies
        run: npm ci                       # ci is faster + reproducible vs install

      # ── CODE OPTIMIZATION (runs before every build) ───────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint check
        run: npx eslint src/ App.tsx --ext .ts,.tsx --max-warnings 0 || true

      - name: Bundle size analysis
        run: |
          npx expo export --platform android --output-dir /tmp/bundle-check 2>/dev/null || true
          if [ -d /tmp/bundle-check ]; then
            SIZE=$(du -sh /tmp/bundle-check | cut -f1)
            echo "JS bundle size: $SIZE"
            if [ $(du -s /tmp/bundle-check | cut -f1) -gt 10240 ]; then
              echo "⚠ Bundle exceeds 10MB — review large imports"
            fi
          fi

      - name: Install Expo CLI
        run: npm install -g @expo/cli --silent

      # ── EXPO PREBUILD ─────────────────────────────────────────
      - name: Expo prebuild
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --clean --no-install

      # ── GRADLE CACHE (saves ~5 min on repeat builds) ─────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" --sdk_root="$ANDROID_SDK_ROOT"

      # ── SIGNING ───────────────────────────────────────────────
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore /tmp/pushcoins.keystore \
            -alias pushcoins -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass PushCoins2024! -keypass PushCoins2024! \
            -dname "CN=Chabad PushCoins,O=Chabad K.Borochov,L=Givatayim,C=IL" \
            -noprompt

      - name: Inject signing config
        working-directory: android
        run: |
          cat >> app/build.gradle << 'EOF'
          android.signingConfigs {
              pushcoinsRelease {
                  storeFile file('/tmp/pushcoins.keystore')
                  storePassword 'PushCoins2024!'
                  keyAlias 'pushcoins'
                  keyPassword 'PushCoins2024!'
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.pushcoinsRelease
          EOF

      # ── BUILD ─────────────────────────────────────────────────
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --quiet

      - name: Get APK info
        id: apk
        run: |
          APK=$(find android -name "*.apk" -path "*/release/*" | head -1)
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "APK: $APK ($SIZE)"

      # ── RELEASE ───────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushCoins-Chabad-v${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🪙 PushCoins Chabad — Build ${{ github.run_number }}"
          body: |
            ## PushCoins — Chabad K.Borochov & Tel Ganim
            APK size: ${{ steps.apk.outputs.size }}

            **Download APK → send to phones → install.**

            ### Install on Android
            1. Settings → Security → Unknown sources ✓
            2. Open the APK file → Install

            ### What's in this build
            - Drag ½/1/2/5/10 NIS coins into pushka
            - Coin-drop sounds
            - Running total (₪)
            - Donate via Bit or PayBox → 0508100010
            - Hebrew RTL, 60fps animations
          files: ${{ steps.apk.outputs.path }}
